[theme]
base = "light"
primaryColor = "#526646"
backgroundColor = "#F8F7F2"
secondaryBackgroundColor = "#E7ECDF"
textColor = "#2D3B32"

[server]
headless = true
enableStaticServing = true

enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
